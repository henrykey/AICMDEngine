services:
  mcp-router:
    build:
      context: ..
      dockerfile: Dockerfile.mcp-router
      args:
        USE_WHEELHOUSE: "true"
    image: aiplanner-mcp-router:latest
    container_name: aiplanner-mcp-router
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      WS_MAX_SIZE: "20971520"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EXTERNAL_MCPS_FILE: /app/config/external_mcps.yml
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.8}
      MEMBERSHIP_SERVICE_URL: ${MEMBERSHIP_SERVICE_URL}
      ENABLE_EXTERNAL_MCPS: ${ENABLE_EXTERNAL_MCPS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  plan2:
    build:
      context: ../plan2
      dockerfile: Dockerfile
    image: aiplanner-plan2:latest
    container_name: aiplanner-plan2
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      MEMBERSHIP_UPSTREAM: ${MEMBERSHIP_UPSTREAM:-http://membership-api:8080}
    depends_on:
      mcp-router:
        condition: service_healthy
    ports:
      - "5122:5122"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./plan2/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5122/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  pdf2md-enhanced:
    build:
      context: ../mcp/servers/PDF2MDEnhanced
      dockerfile: Dockerfile
    image: aiplanner-pdf2md-enhanced:latest
    container_name: aiplanner-pdf2md-enhanced
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PDF2MD_ENH_OUTPUT_DIR: /app/data/output
      PDF2MD_ENH_PAGE_TIMEOUT_SEC: ${PDF2MD_ENH_PAGE_TIMEOUT_SEC:-600}
      PDF2MD_ENH_VLM_CALL_TIMEOUT_CAP_SEC: ${PDF2MD_ENH_VLM_CALL_TIMEOUT_CAP_SEC:-600}
    ports:
      - "9010:9010"
    volumes:
      - ../mcp/servers/PDF2MDEnhanced/data/input:/app/data/input
      - ../mcp/servers/PDF2MDEnhanced/data/output:/app/data/output
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9010), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  office-word:
    build:
      context: ../mcp/servers/office-word
      dockerfile: Dockerfile
    image: aiplanner-office-word:latest
    container_name: aiplanner-office-word
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9002"
      FASTMCP_LOG_LEVEL: INFO
    ports:
      - "9002:9002"
    volumes:
      - ${DOCUMENTS_HOST_DIR:-./data/documents}:/documents
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  docs-converter:
    build:
      context: ../mcp/servers/docs-converter
      dockerfile: Dockerfile
    image: aiplanner-docs-converter:latest
    container_name: aiplanner-docs-converter
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9012"
    ports:
      - "9012:9012"
    volumes:
      - ${DOCUMENTS_HOST_DIR:-./data/documents}:/documents
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9012), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pageindex:
    build:
      context: ../mcp/servers/PageIndex
      dockerfile: Dockerfile
    image: aiplanner-pageindex:latest
    container_name: aiplanner-pageindex
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PAGEINDEX_VLM_CALL_TIMEOUT_CAP_SEC: ${PAGEINDEX_VLM_CALL_TIMEOUT_CAP_SEC:-1200}
    ports:
      - "9011:9011"
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9011), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  k-graph-mcp:
    build:
      context: ../mcp/servers/k-graph-mcp
      dockerfile: Dockerfile
    image: aiplanner-k-graph-mcp:latest
    container_name: aiplanner-k-graph-mcp
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9013"
      K_GRAPH_MCP_MONGODB_URI: ${K_GRAPH_MCP_MONGODB_URI:-${MONGODB_URI:-}}
      MEMBERSHIP_API_URL: ${MEMBERSHIP_SERVICE_URL:-http://membership-api:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      K_GRAPH_MCP_LLM_MODEL: ${K_GRAPH_MCP_LLM_MODEL:-${OPENAI_MODEL_NAME:-}}
      K_GRAPH_MCP_MAX_WORKERS: ${K_GRAPH_MCP_MAX_WORKERS:-2}
    ports:
      - "9013:9013"
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9013), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  basin-comparator-mcp:
    build:
      context: ../../basin-comparator/backend
      dockerfile: Dockerfile.mcp
    image: aiplanner-basin-comparator-mcp:latest
    container_name: aiplanner-basin-comparator-mcp
    platform: ${BUILD_PLATFORM}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MEMBERSHIP_BASE_URL: ${MEMBERSHIP_SERVICE_URL:-http://membership-api:8080}
      DOCINTEL_BASE_URL: ${DOCINTEL_BASE_URL:-http://membership-api:8080}
    ports:
      - "8139:8139"
    networks:
      - membership_default
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8139), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  membership_default:
    external: true
