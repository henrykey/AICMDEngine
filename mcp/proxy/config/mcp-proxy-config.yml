# MCP WebSocket Proxy 配置文件
# 将 stdio MCP 转换为 WebSocket 服务器
# 支持两种模式:
#   1. type: process  - 启动本地 stdio MCP 进程（默认）
#   2. type: docker   - 连接到 Docker 容器中的 stdio MCP

proxy:
  # 基础端口号（每个 stdio MCP 会从这个端口开始分配）
  port_base: 9000

# 要代理的 MCP 服务器列表
servers:
  # PaddleOCR MCP Server - stdio 模式（本地进程）
  - name: paddleocr
    port: 9001
    cwd: ../../servers/paddleocr
    command: ["python"]
    args: ["-m", "paddleocr_mcp"]
    env:
      PYTHONUNBUFFERED: "1"
      PADDLEOCR_MCP_PIPELINE: "OCR"
      PADDLEOCR_MCP_PPOCR_SOURCE: "local"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

  # Office Word MCP Server - stdio 模式（本地进程）
  - name: office-word
    port: 9002
    cwd: ../../servers/office-word
    command: ["python"]
    args: ["word_mcp_server.py"]
    env:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: "stdio"

  # PDF2MD MCP Server - stdio 模式（本地进程）
  - name: pdf2md
    port: 9003
    cwd: ../../servers/PDF2MD
    command: ["/Users/kehongwei/workspace/AICMDEngine/.venv/bin/python"]
    args: ["-m", "PDF2MD.__main__"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/Users/kehongwei/workspace/AICMDEngine/mcp/servers"
      # VLM Configuration for Qwen
      # TODO: 生产环境优化方案：
      #   1. 使用环境变量或配置中心管理敏感信息（API key）
      #   2. 将 VLM 配置移到独立的配置文件（如 config/vlm.yml）
      #   3. 支持运行时动态加载 VLM 配置
      # 当前：直接写死在配置文件中（仅用于开发测试）
      VLM_MODEL_PROVIDER: "qwen"
      QWEN_API_KEY: "sk-a67114a92fdf4964bb6a5f47beccd00d"
      QWEN_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      QWEN_MODEL_NAME: "qwen3-vl-flash-2026-01-22"
      PDF2MD_ALLOW_EXTERNAL_VLM: "true"

