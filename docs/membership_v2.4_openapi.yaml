  /v2/auth/otp-request:
    post:
      tags:
      - Auth
      summary: 请求OTP验证码
      description: 向用户的手机或邮箱发送一次性密码（OTP），用于登录或其它验证场景。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              - channel
              properties:
                contact:
                  type: string
                  description: 接收验证码的联系方式（手机号或邮箱）
                channel:
                  type: string
                  enum:
                  - SMS
                  - EMAIL
                  description: 发送渠道
                purpose:
                  type: string
                  enum:
                  - login
                  - register
                  - reset_password
                  default: login
      responses:
        '200':
          description: 验证码发送请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '429':
          description: 发送频率限制
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    retry_after:
                      type: integer
                      description: 需要等待的秒数
        '400':
          description: 联系方式格式错误或用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2AuthOtpRequestPost
  /v2/auth/otp-login:
    post:
      tags:
      - Auth
      summary: 使用OTP验证码登录
      description: 使用从 /auth/otp-request 获取的令牌和用户收到的验证码完成登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
