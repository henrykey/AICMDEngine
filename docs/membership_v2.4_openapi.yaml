openapi: 3.0.3
info:
  title: 成员管理系统 API
  version: 2.4.0
  description: '多组织/多层级成员管理系统v2.4的接口定义。


    **v2.4重点说明**：

    - 审计链路升级至 Outbox + Kafka + MongoDB + CDC，实现统一通用审计

    - 接口契约与 v2.3 保持一致，客户端无需调整调用参数

    - `/audit/logs` 查询现由 MongoDB 提供数据，仍遵循原返回结构


    **v2.3核心改进回顾**：

    - 访问控制简化：统一三主体模型，删除Position系列表

    - rwx位图权限：支持高效JWT权限传递

    - 多语言简化：主表单语言+可选翻译表

    - AI Agent同构：虚拟成员与真实成员统一治理

    '
servers:
- url: https://api.example.com
  description: 生产环境
- url: https://staging-api.example.com
  description: 预发布环境
- url: http://localhost:8080
  description: 开发环境
tags:
- name: Auth
  description: 认证与令牌
- name: Members
  description: 成员（含虚拟成员）
- name: Roles
  description: 角色与授权
- name: Permissions
  description: 权限点
- name: Orgs
  description: 组织单元与层级
- name: Authz
  description: 鉴权检查
- name: Resources
  description: 资源管理
- name: Agents
  description: AI Agent专属功能
- name: I18n
  description: 多语言翻译管理
- name: Settings
  description: 系统配置管理
- name: Audit
  description: 审计日志
- name: Workflow
  description: 流程管理（基于 Flowable 7.0）
security:
- bearerAuth: []
- apiKeyAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: false
      description: 租户ID
      schema:
        type: integer
        format: int64
    OrgIdQuery:
      name: org_id
      in: query
      schema:
        type: integer
        format: int64
      description: 组织ID（用于范围限定）
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Language:
      name: lang
      in: query
      schema:
        type: string
        default: zh
      description: 语言代码（zh, en, ja, ko, fr, de, es, ru等）
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        default: zh
      description: 语言偏好（zh/en/ja等），用于翻译覆盖
  schemas:
    Error:
      type: object
      required:
      - error_code
      - error_message
      properties:
        error_code:
          type: string
        error_message:
          type: string
        details:
          type: object
          additionalProperties: true
    LoginResponse:
      type: object
      properties:
        username:
          type: string
          nullable: true
        access_token:
          type: string
          nullable: true
        refresh_token:
          type: string
          nullable: true
        token_type:
          type: string
        expires_in:
          type: integer
        member_id:
          type: integer
          nullable: true
        full_name:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
        auto_login_token:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Member:
      type: object
      required:
      - id
      - status
      - isVirtual
      - createdAt
      - updatedAt
      - email
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        gender:
          type: string
          enum:
          - male
          - female
          - other
          - unknown
          nullable: true
        age:
          type: integer
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        isVirtual:
          type: boolean
        agentType:
          type: string
          nullable: true
        ownerMemberId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
          - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberCreate:
      type: object
      required:
      - username
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        fullName:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        gender:
          type: string
          enum:
          - male
          - female
          - other
          - unknown
          nullable: true
        age:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        isVirtual:
          type: boolean
          default: false
        agentType:
          type: string
          nullable: true
        ownerMemberId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
          - suspended
          default: active
    MemberUpdate:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
          - suspended
    Role:
      type: object
      required:
      - org_id
      - code
      - name
      properties:
        id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
          description: 角色所属组织ID
        code:
          type: string
          description: 角色唯一标识码，用于程序化访问
        name:
          type: string
        description:
          type: string
          nullable: true
        is_position:
          type: boolean
          default: false
          description: 是否为岗位角色
        headcount:
          type: integer
          nullable: true
          description: 岗位编制数（仅岗位角色有效）
        is_unique:
          type: boolean
          nullable: true
          description: 是否唯一岗位（仅岗位角色有效）
        active:
          type: boolean
          default: true
          description: 角色是否激活
        originalName:
          type: string
          nullable: true
        originalDescription:
          type: string
          nullable: true
        supportedLanguages:
          type: array
          items:
            type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Permission:
      type: object
      required:
      - code
      - resource
      - action
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
          description: 权限所属租户ID
        code:
          type: string
        name:
          type: string
          nullable: true
        resource:
          type: string
        action:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: 权限分类（如：system, business, data等）
        org_scope:
          type: string
          enum:
          - global
          - org
          - self
          default: org
          description: 组织适用范围
        active:
          type: boolean
          default: true
          description: 权限是否激活
        system_permission:
          type: boolean
          default: false
          description: 是否为系统内置权限
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrgUnit:
      type: object
      required:
      - id
      - tenantId
      - name
      - type
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum:
          - company
          - dept
          - team
          - committee
          - project
          - taskforce
        description:
          type: string
          nullable: true
        originalName:
          type: string
          nullable: true
        originalType:
          type: string
          nullable: true
        supportedLanguages:
          type: array
          items:
            type: string
          nullable: true
        isTemporary:
          type: boolean
        validUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthzCheckRequest:
      type: object
      required:
      - resource
      - action
      properties:
        resource:
          type: string
          example: orders
        action:
          type: string
          example: read
        org_id:
          type: integer
          format: int64
          nullable: true
        on_behalf_of:
          type: integer
          format: int64
          nullable: true
    AuthzCheckResponse:
      type: object
      required:
      - allowed
      properties:
        allowed:
          type: boolean
        reason:
          type: string
    PageMembers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageRoles:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageOrgs:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrgUnit'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PagePermissions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RoleCreate:
      type: object
      required:
      - org_id
      - code
      - name
      properties:
        org_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_position:
          type: boolean
          default: false
        headcount:
          type: integer
          nullable: true
        is_unique:
          type: boolean
          nullable: true
        active:
          type: boolean
          default: true
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        headcount:
          type: integer
          nullable: true
        is_unique:
          type: boolean
          nullable: true
        active:
          type: boolean
    PermissionCreate:
      type: object
      required:
      - code
      - resource
      - action
      properties:
        code:
          type: string
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        category:
          type: string
        org_scope:
          type: string
          enum:
          - global
          - org
          - self
          default: org
        active:
          type: boolean
          default: true
        system_permission:
          type: boolean
          default: false
    PermissionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        org_scope:
          type: string
          enum:
          - global
          - org
          - self
        active:
          type: boolean
    PermissionGrant:
      type: object
      required:
      - member_id
      - permission_id
      properties:
        member_id:
          type: integer
          format: int64
        permission_id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    PermissionRevoke:
      type: object
      required:
      - member_id
      - permission_id
      properties:
        member_id:
          type: integer
          format: int64
        permission_id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
          nullable: true
    PermissionCheck:
      type: object
      required:
      - member_id
      - resource
      - action
      properties:
        member_id:
          type: integer
          format: int64
        resource:
          type: string
        action:
          type: string
        org_id:
          type: integer
          format: int64
          nullable: true
    PermissionCheckResult:
      type: object
      required:
      - allowed
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        source:
          type: string
          enum:
          - direct
          - role
          nullable: true
        role_id:
          type: integer
          format: int64
          nullable: true
    MemberPermissions:
      type: object
      properties:
        member_id:
          type: integer
          format: int64
        direct_permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: 直接分配给成员的权限
        role_permissions:
          type: array
          items:
            type: object
            properties:
              role:
                $ref: '#/components/schemas/Role'
              permissions:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
    MemberRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        org_id:
          type: integer
          format: int64
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        granted_at:
          type: string
          format: date-time
        granted_by:
          type: integer
          format: int64
    MemberRoleAssignment:
      type: object
      required:
      - role_id
      properties:
        role_id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    Resource:
      type: object
      required:
      - id
      - system_code
      - name
      - type
      - access_mode
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        system_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: 系统代码（ASCII）
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        type:
          type: string
          enum:
          - function
          - data
          description: 资源类型
        access_mode:
          type: string
          enum:
          - whitelist
          - blacklist
          description: 访问模式
        active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
          format: int64
    OrgHierarchy:
      type: object
      required:
      - tenant_id
      - parent_id
      - child_id
      properties:
        tenant_id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
        child_id:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
    AgentCredential:
      type: object
      required:
      - member_id
      - kid
      - type
      - secret_hash
      properties:
        member_id:
          type: integer
          format: int64
        kid:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum:
          - api_key
          - oauth2
          - jwt
        secret_hash:
          type: string
        scope_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    AgentPolicy:
      type: object
      required:
      - member_id
      properties:
        member_id:
          type: integer
          format: int64
        tools_allowed:
          type: array
          items:
            type: string
          description: 允许使用的工具列表
        data_scopes:
          type: array
          items:
            type: string
          description: 数据访问范围
        max_actions_per_min:
          type: integer
          default: 100
          description: 每分钟最大操作数
        redaction_rules:
          type: object
          additionalProperties: true
          description: 脱敏规则
        pii_access_level:
          type: string
          enum:
          - none
          - mask
          - full
          default: none
          description: PII访问级别
        updated_at:
          type: string
          format: date-time
    AgentRunLog:
      type: object
      required:
      - run_id
      - member_id
      - status
      - started_at
      properties:
        run_id:
          type: string
        member_id:
          type: integer
          format: int64
        caller_member_id:
          type: integer
          format: int64
          nullable: true
        org_context:
          type: string
        input_hash:
          type: string
        output_hash:
          type: string
        tool_calls_json:
          type: object
          additionalProperties: true
        status:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        signature:
          type: string
          description: 防篡改签名
    PermissionCheckRequest:
      type: object
      required:
      - member_id
      - resource_id
      - required_mask
      properties:
        member_id:
          type: integer
          format: int64
        resource_id:
          type: integer
          format: int64
        required_mask:
          type: integer
          minimum: 1
          maximum: 7
          description: 所需权限掩码
        org_context:
          type: integer
          format: int64
          description: 组织上下文
    PermissionCheckResponse:
      type: object
      required:
      - allowed
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: 拒绝原因（如果适用）
        effective_mask:
          type: integer
          description: 用户实际拥有的权限掩码
    PermissionBitmapResponse:
      type: object
      required:
      - member_id
      - system_code
      - bitmap
      properties:
        member_id:
          type: integer
          format: int64
        system_code:
          type: string
        bitmap:
          type: string
          description: Base64编码的权限位图
        version:
          type: string
          description: 位图版本
        generated_at:
          type: string
          format: date-time
    BatchPermissionRequest:
      type: object
      required:
      - operations
      properties:
        operations:
          type: array
          items:
            type: object
            required:
            - action
            - permission
            properties:
              action:
                type: string
                enum:
                - grant
                - revoke
              permission:
                $ref: '#/components/schemas/Permission'
    BatchOperationResult:
      type: object
      properties:
        success_count:
          type: integer
        failure_count:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              operation_id:
                type: string
              success:
                type: boolean
              error:
                type: string
                nullable: true
    I18nTranslation:
      type: object
      required:
      - tenant_id
      - entity_type
      - entity_id
      - locale
      properties:
        tenant_id:
          type: integer
          format: int64
        entity_type:
          type: string
          enum:
          - org_unit
          - role
          - resource
          - permission
        entity_id:
          type: integer
          format: int64
        locale:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: integer
          format: int64
    Settings:
      type: object
      required:
      - org_id
      - key
      properties:
        org_id:
          type: integer
          format: int64
          description: 组织ID，0表示全局配置
        key:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
          maxLength: 1000
        description:
          type: string
          maxLength: 200
        updated_at:
          type: string
          format: date-time
    OtpRequestResponse:
      type: object
      properties:
        otp_token:
          type: string
          description: 用于后续验证OTP的临时令牌
        expires_at:
          type: string
          format: date-time
          description: OTP令牌的过期时间
        retry_after_seconds:
          type: integer
          description: 可以再次请求OTP的秒数
    UpdatePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: 当前密码（对于管理员模式可选）
        newPassword:
          type: string
          description: 新密码
          minLength: 8
      required:
      - newPassword
    OtpLoginRequest:
      type: object
      required:
      - contact
      - otp_code
      - otp_token
      properties:
        contact:
          type: string
          description: 接收OTP的联系方式（手机或邮箱）
        otp_code:
          type: string
          description: 收到的6位数字验证码
        otp_token:
          type: string
          description: 请求OTP时获取的临时令牌
    AutoLoginRequest:
      type: object
      required:
      - device_id
      - auto_login_token
      properties:
        device_id:
          type: string
          description: 设备唯一标识
        auto_login_token:
          type: string
          description: 用于自动登录的长期令牌
    MemberOrg:
      type: object
      required:
      - tenant_id
      - member_id
      - org_id
      - relation_type
      properties:
        tenant_id:
          type: integer
          format: int64
        member_id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
        relation_type:
          type: string
          enum:
          - primary
          - secondary
          - guest
          - external
          default: primary
          description: 归属类型
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          default: true
        source:
          type: string
          nullable: true
        description:
          type: string
          maxLength: 200
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
          format: int64
    PagedMembers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PagedRoles:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/PageMeta'
    MemberCreateRequest:
      type: object
      required:
      - username
      - full_name
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 20
        is_virtual:
          type: boolean
          default: false
        agent_type:
          type: string
          enum:
          - llm
          - workflow
          - service
          - bot
        owner_member_id:
          type: integer
          format: int64
        password:
          type: string
          minLength: 8
          description: 密码（仅人类成员）
    RoleCreateRequest:
      type: object
      required:
      - org_id
      - name
      properties:
        org_id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        is_position:
          type: boolean
          default: false
    ProcessDefinitionDTO:
      type: object
      properties:
        id:
          type: string
          description: 流程定义ID
        key:
          type: string
          description: 流程定义键（唯一标识）
        name:
          type: string
          description: 流程定义名称
        version:
          type: string
          description: 流程版本号
        category:
          type: string
          description: 流程分类
        active:
          type: boolean
          description: 是否激活
        deploymentId:
          type: string
          description: 部署ID
        diagramResourceName:
          type: string
          description: 流程图资源名称
        resourceName:
          type: string
          description: 流程资源名称
    ProcessInstanceDTO:
      type: object
      properties:
        id:
          type: string
          description: 流程实例ID
        businessKey:
          type: string
          description: 业务键
        processDefinitionId:
          type: string
          description: 流程定义ID
        processDefinitionKey:
          type: string
          description: 流程定义键
        name:
          type: string
          description: 流程实例名称
        suspended:
          type: boolean
          description: 是否挂起
        tenantId:
          type: string
          description: 租户ID
        variables:
          type: object
          description: 流程变量
          additionalProperties: true
    DeploymentDTO:
      type: object
      properties:
        id:
          type: string
          description: 部署ID
        name:
          type: string
          description: 部署名称
        deploymentTime:
          type: integer
          format: int64
          description: 部署时间戳（毫秒）
        category:
          type: string
          description: 分类
        tenantId:
          type: string
          description: 租户ID
    ProcessStatisticsDTO:
      type: object
      properties:
        totalDefinitions:
          type: integer
          format: int64
          description: 总流程定义数
        totalInstances:
          type: integer
          format: int64
          description: 总实例数
        activeInstances:
          type: integer
          format: int64
          description: 活跃实例数
        suspendedInstances:
          type: integer
          format: int64
          description: 挂起实例数
        completedInstances:
          type: integer
          format: int64
          description: 已完成实例数
        totalDeployments:
          type: integer
          format: int64
          description: 总部署数
        processKey:
          type: string
          description: 流程定义键
        processInstances:
          type: integer
          format: int64
          description: 该流程实例数
        processCompleted:
          type: integer
          format: int64
          description: 该流程已完成数
        processActive:
          type: integer
          format: int64
          description: 该流程活跃数
    HistoryInstanceDTO:
      type: object
      properties:
        id:
          type: string
          description: 历史实例ID
        businessKey:
          type: string
          description: 业务键
        processDefinitionId:
          type: string
          description: 流程定义ID
        processDefinitionKey:
          type: string
          description: 流程定义键
        name:
          type: string
          description: 实例名称
        startUserId:
          type: string
          description: 启动用户ID
        startTime:
          type: integer
          format: int64
          description: 启动时间戳
        endTime:
          type: integer
          format: int64
          description: 结束时间戳
        duration:
          type: integer
          format: int64
          description: 耗时（毫秒）
        deleteReason:
          type: string
          description: 删除原因
        completed:
          type: boolean
          description: 是否已完成
        tenantId:
          type: string
          description: 租户ID
    HistoryTaskDTO:
      type: object
      properties:
        id:
          type: string
          description: 任务ID
        name:
          type: string
          description: 任务名称
        assignee:
          type: string
          description: 被分配人
        owner:
          type: string
          description: 拥有者
        processInstanceId:
          type: string
          description: 流程实例ID
        processDefinitionId:
          type: string
          description: 流程定义ID
        taskDefinitionKey:
          type: string
          description: 任务定义键
        createTime:
          type: integer
          format: int64
          description: 创建时间戳
        completeTime:
          type: integer
          format: int64
          description: 完成时间戳
        duration:
          type: integer
          format: int64
          description: 耗时（毫秒）
        deleteReason:
          type: string
          description: 删除原因
    PageResult:
      type: object
      properties:
        data:
          type: array
          description: 数据列表
          items:
            type: object
        total:
          type: integer
          format: int64
          description: 总记录数
        pageNum:
          type: integer
          format: int32
          description: 当前页码
        pageSize:
          type: integer
          format: int32
          description: 每页大小
        pages:
          type: integer
          format: int32
          description: 总页数
paths:
  /v2/auth/token:
    post:
      tags:
      - Auth
      summary: 获取访问令牌（用户或Agent）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - password
                  - client_credentials
                  - refresh_token
                username:
                  type: string
                password:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2AuthTokenPost
  /v2/auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                device_id:
                  type: string
                  description: 设备ID，用于设备认证
              required:
              - username
              - password
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      operationId: v2AuthLoginPost
  /v2/members:
    get:
      tags:
      - Members
      summary: 查询成员列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: keyword
        in: query
        schema:
          type: string
        description: 按用户名/昵称/别名/全名搜索
      - name: is_virtual
        in: query
        schema:
          type: boolean
        description: 是否仅返回虚拟成员
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - suspended
        description: 按成员状态过滤
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMembers'
      operationId: v2MembersGet
    post:
      tags:
      - Members
      summary: 新增成员（可标记为虚拟成员）
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
      operationId: v2MembersPost
  /v2/members/{id}:
    get:
      tags:
      - Members
      summary: 获取成员详情
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
      operationId: v2MembersIdGet
    patch:
      tags:
      - Members
      summary: 修改成员资料
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
      operationId: v2MembersIdPatch
    delete:
      operationId: deleteMember
      tags:
      - Members
      summary: 停用成员
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
  /v2/members/{id}/permissions:
    get:
      tags:
      - Members
      - Permissions
      summary: 获取成员的所有权限
      description: 返回成员的直接权限和通过角色继承的权限
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: org_id
        in: query
        schema:
          type: integer
          format: int64
        description: 限定组织范围的权限
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPermissions'
        '404':
          description: 成员不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2MembersIdPermissionsGet
  /v2/members/{id}/roles:
    get:
      tags:
      - Members
      - Roles
      summary: 获取成员的角色列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: org_id
        in: query
        schema:
          type: integer
          format: int64
        description: 限定组织范围的角色
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRole'
        '404':
          description: 成员不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2MembersIdRolesGet
    post:
      tags:
      - Members
      - Roles
      summary: 给成员分配角色
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleAssignment'
      responses:
        '204':
          description: No Content
        '404':
          description: 成员或角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2MembersIdRolesPost
  /v2/permissions/grant:
    post:
      tags:
      - Permissions
      summary: 直接授予权限给成员
      description: 绕过角色，直接给成员分配权限
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrant'
      responses:
        '204':
          description: No Content
        '404':
          description: 成员或权限不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2PermissionsGrantPost
  /v2/permissions/revoke:
    post:
      operationId: revokePermission
      tags:
      - Permissions
      summary: 撤销成员的直接权限
      description: 撤销直接分配给成员的权限，不影响通过角色继承的权限
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionRevoke'
      responses:
        '204':
          description: No Content
        '404':
          description: 成员或权限不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/permissions/check:
    post:
      tags:
      - Permissions
      summary: 检查成员权限
      description: 检查成员是否拥有特定权限（包括直接权限和角色继承权限）
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCheck'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckResult'
      operationId: v2PermissionsCheckPost
  /v2/roles:
    get:
      tags:
      - Roles
      summary: 角色列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/OrgIdQuery'
      - name: is_position
        in: query
        schema:
          type: boolean
        description: 是否仅返回岗位角色
      - name: active
        in: query
        schema:
          type: boolean
        description: 按角色状态过滤
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRoles'
      operationId: v2RolesGet
    post:
      tags:
      - Roles
      summary: 新增角色
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
      operationId: v2RolesPost
  /v2/roles/{id}:
    get:
      tags:
      - Roles
      summary: 获取角色详情
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdGet
    patch:
      operationId: updateRole
      tags:
      - Roles
      summary: 更新角色信息
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteRole
      tags:
      - Roles
      summary: 删除角色
      description: 删除角色。如果角色已分配给成员，将返回错误。
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: 角色已分配给成员，无法删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/roles/{id}/permissions:
    get:
      tags:
      - Roles
      - Permissions
      summary: 获取角色的权限列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdPermissionsGet
    put:
      tags:
      - Roles
      - Permissions
      summary: 设置角色权限（覆盖式）
      description: 替换角色的所有权限，之前的权限分配将被清除
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permission_ids
              properties:
                permission_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 权限ID列表
      responses:
        '204':
          description: No Content
        '404':
          description: 角色或权限不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdPermissionsPut
    post:
      tags:
      - Roles
      - Permissions
      summary: 给角色添加权限
      description: 为角色添加新的权限，不影响现有权限
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permission_ids
              properties:
                permission_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 要添加的权限ID列表
      responses:
        '204':
          description: No Content
        '404':
          description: 角色或权限不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdPermissionsPost
  /v2/roles/{id}/permissions/{permission_id}:
    delete:
      tags:
      - Roles
      - Permissions
      summary: 移除角色的特定权限
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: permission_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '404':
          description: 角色或权限不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdPermissionsPermission_idDelete
  /v2/roles/{id}/members:
    get:
      tags:
      - Roles
      - Members
      summary: 获取拥有此角色的成员列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMembers'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: v2RolesIdMembersGet
  /v2/permissions:
    get:
      tags:
      - Permissions
      summary: 权限点列表
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: category
        in: query
        schema:
          type: string
        description: 按权限分类过滤
      - name: resource
        in: query
        schema:
          type: string
        description: 按资源类型过滤
      - name: active
        in: query
        schema:
          type: boolean
