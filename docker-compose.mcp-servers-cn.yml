#
# CN override for MCP server builds.
# Use together with the base compose file:
#   docker compose -f docker-compose.mcp-servers.yml -f docker-compose.mcp-servers-cn.yml build office-word-mcp
#   docker compose -f docker-compose.mcp-servers.yml -f docker-compose.mcp-servers-cn.yml build pdf2md-enhanced-mcp
#
services:
  mcp-router:
    build:
      dockerfile: Dockerfile.mcp-router.cn
      args:
        PYTHON_BASE_IMAGE: ${CN_PYTHON_311_IMAGE:-docker.1ms.run/python:3.11-slim}

  local-retrieval:
    build:
      dockerfile: Dockerfile.cn

  office-word-mcp:
    build:
      dockerfile: Dockerfile.cn
      args:
        PYTHON_BASE_IMAGE: ${CN_PYTHON_311_IMAGE:-docker.1ms.run/python:3.11-slim}

  pdf2md-enhanced-mcp:
    build:
      dockerfile: Dockerfile.cn
      args:
        PYTHON_BASE_IMAGE: ${CN_PYTHON_312_IMAGE:-docker.1ms.run/python:3.12-slim}
  pageindex-mcp:
    build:
      dockerfile: Dockerfile.cn
      args:
        PYTHON_BASE_IMAGE: ${CN_PYTHON_312_IMAGE:-docker.1ms.run/python:3.12-slim}

  plan2-ui:
    build:
      dockerfile: Dockerfile.cn
      args:
        NODE_BASE_IMAGE: ${CN_NODE_20_IMAGE:-docker.1ms.run/node:20-alpine}
        NGINX_BASE_IMAGE: ${CN_NGINX_IMAGE:-docker.1ms.run/nginx:alpine}
