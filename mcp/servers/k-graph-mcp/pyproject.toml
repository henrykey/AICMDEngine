[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-graph-mcp"
version = "0.0.0"
description = "BasinComparator knowledge-graph MCP contracts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.25",
  "mcp>=1.0",
  "openai>=1.0",
  "pydantic>=2.0",
  "pymongo>=4.6",
]

[project.scripts]
k-graph-mcp = "k_graph_mcp.__main__:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["k_graph_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
