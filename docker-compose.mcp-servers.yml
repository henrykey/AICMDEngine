# MCP Servers Docker Compose Configuration
# 容器化部署外部 MCP 服务器
#
# 用法:
#   docker-compose -f docker-compose.mcp-servers.yml up -d
#   docker-compose -f docker-compose.mcp-servers.yml down
#
# 注意:
#   - PaddleOCR MCP: HTTP/SSE 模式（直接监听端口）
#   - Office Word MCP: stdio 模式（通过 docker exec）
#   - MCP Router/客户端通过 HTTP 连接到 PaddleOCR，通过 docker exec 连接到 Office Word

version: '3.8'

services:
  # MCP Router - AIPlanner MCP 服务统一入口
  mcp-router:
    build:
      context: .
      dockerfile: Dockerfile.mcp-router
    image: mcp-router:latest
    container_name: mcp-router-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      EXTERNAL_MCPS: '{"paddleocr":{"transport":"http","url":"http://host.docker.internal:9001","timeout":300}}'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM_BASE_URL: ${LLM_BASE_URL}
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.8}
      MEMBERSHIP_SERVICE_URL: http://host.docker.internal:8080
    networks:
      - mcp-servers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PaddleOCR MCP Server - SSE HTTP 模式
  paddleocr-mcp:
    build:
      context: ./mcp/servers/paddleocr
      dockerfile: Dockerfile
    image: paddleocr-mcp:latest
    profiles: ["optional"]
    container_name: paddleocr-mcp
    restart: unless-stopped
    ports:
      - "9001:9001"
    # 持久化模型文件，避免每次容器重建时重新下载
    volumes:
      - paddleocr-models:/root/.paddlex
    environment:
      - PYTHONUNBUFFERED=1
      - PADDLEOCR_MCP_PIPELINE=OCR
      - PADDLEOCR_MCP_PPOCR_SOURCE=local
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    # 资源限制 - 增加内存用于处理大型图像
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 6G
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Office Word MCP Server - SSE HTTP 模式
  office-word-mcp:
    build:
      context: ./mcp/servers/office-word
      dockerfile: Dockerfile
    image: office-word-mcp:latest
    profiles: ["optional"]
    container_name: office-word-mcp
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9002
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - mcp-servers-network
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Plan2 Frontend - AIPlanner 前端
  plan2-ui:
    build:
      context: ./plan2
      dockerfile: Dockerfile
    image: plan2-ui:latest
    container_name: plan2-ui-dev
    depends_on:
      mcp-router:
        condition: service_healthy
    ports:
      - "5122:5122"
    networks:
      - mcp-servers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5122/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# 网络配置
networks:
  mcp-servers-network:
    driver: bridge

# 定义持久化卷
volumes:
  paddleocr-models:
    driver: local
