# MCP WebSocket Proxy 配置文件
# 将 stdio MCP 转换为 WebSocket 服务器
# 支持两种模式:
#   1. type: process  - 启动本地 stdio MCP 进程（默认）
#   2. type: docker   - 连接到 Docker 容器中的 stdio MCP

proxy:
  # 基础端口号（每个 stdio MCP 会从这个端口开始分配）
  port_base: 9000

# 要代理的 MCP 服务器列表
servers:
  # PaddleOCR MCP Server - stdio 模式（本地进程）
  - name: paddleocr
    port: 9001
    cwd: ../../servers/paddleocr
    command: ["python"]
    args: ["-m", "paddleocr_mcp"]
    env:
      PYTHONUNBUFFERED: "1"
      PADDLEOCR_MCP_PIPELINE: "OCR"
      PADDLEOCR_MCP_PPOCR_SOURCE: "local"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
