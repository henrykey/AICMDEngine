# Nginx configuration for MCP Router
# Upstream backend server
upstream mcp_router_backend {
    server mcp-router:8000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name mcp.yourdomain.com;  # 修改为实际域名

    # Allow health checks without redirect
    location /health {
        proxy_pass http://mcp_router_backend;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS + WSS (WebSocket Secure)
server {
    listen 443 ssl http2;
    server_name mcp.yourdomain.com;  # 修改为实际域名

    # SSL Certificate (使用Let's Encrypt或自签名证书)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/mcp-router-access.log;
    error_log /var/log/nginx/mcp-router-error.log;

    # WebSocket endpoint (WSS)
    location /mcp/v1 {
        proxy_pass http://mcp_router_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout settings (7 days)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://mcp_router_backend/health;
        access_log off;
    }

    # REST API endpoints
    location /v1/ {
        proxy_pass http://mcp_router_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
