    put:
      tags:
      - Members
      summary: 批量覆盖成员归属组织
      description: 用请求体中的归属集合覆盖成员当前的全部归属（幂等）。未出现在列表中的原有归属将被移除。
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orgs
              properties:
                orgs:
                  type: array
                  items:
                    type: object
                    required:
                    - org_id
                    properties:
                      org_id:
                        type: integer
                        format: int64
                      relation_type:
                        type: string
                        enum:
                        - primary
                        - secondary
                        - guest
                        - external
                      valid_until:
                        type: string
                        format: date-time
                      active:
                        type: boolean
      responses:
        '200':
          description: 覆盖完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberOrg'
      operationId: v2MembersIdOrgsPut
    post:
      tags:
      - Members
      summary: 为成员新增归属组织
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org_id
              properties:
                org_id:
                  type: integer
                  format: int64
                relation_type:
                  type: string
                  enum:
                  - primary
                  - secondary
                  - guest
                  - external
                  default: secondary
                valid_until:
                  type: string
                  format: date-time
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOrg'
      operationId: v2MembersIdOrgsPost
