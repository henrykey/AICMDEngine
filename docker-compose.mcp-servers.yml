# MCP Servers Docker Compose Configuration
# 容器化部署外部 MCP 服务器
#
# 用法:
#   docker-compose -f docker-compose.mcp-servers.yml up -d
#   docker-compose -f docker-compose.mcp-servers.yml down
#
# 注意:
#   - PaddleOCR MCP: 通过本地代理（mcp/proxy）暴露 stdio 进程，监听端口 9001
#   - Office Word MCP: 通过本地代理（mcp/proxy）暴露 stdio 进程，监听端口 9002
#   - PDF2MD MCP: 通过本地代理（mcp/proxy）暴露 stdio 进程，监听端口 9003
#   - MCP Router 通过 http://host.docker.internal:9001/2/3 连接到各代理

version: '3.8'

services:
  # MCP Router - AIPlanner MCP 服务统一入口
  mcp-router:
    build:
      context: .
      dockerfile: Dockerfile.mcp-router
    image: mcp-router:latest
    container_name: mcp-router-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      WS_MAX_SIZE: 20971520
      EXTERNAL_MCPS_FILE: /app/config/external_mcps.yml
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM_BASE_URL: ${LLM_BASE_URL}
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.8}
      MEMBERSHIP_SERVICE_URL: http://host.docker.internal:8080
    volumes:
      - ./config:/app/config:ro
    networks:
      - mcp-servers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PaddleOCR MCP Server - SSE HTTP 模式
  paddleocr-mcp:
    build:
      context: ./mcp/servers/paddleocr
      dockerfile: Dockerfile
    image: paddleocr-mcp:latest
    profiles: ["optional"]
    container_name: paddleocr-mcp
    restart: unless-stopped
    ports:
      - "9001:9001"
    # 持久化模型文件，避免每次容器重建时重新下载
    volumes:
      - paddleocr-models:/root/.paddlex
    environment:
      - PYTHONUNBUFFERED=1
      - PADDLEOCR_MCP_PIPELINE=OCR
      - PADDLEOCR_MCP_PPOCR_SOURCE=local
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    # 资源限制 - 增加内存用于处理大型图像
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 6G
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Office Word MCP Server - 已改用本地代理（mcp/proxy）运行，此 Docker 服务不再使用
  # 若需独立运行容器版本，弹此服务并将 MCP_TRANSPORT 改为 sse
  office-word-mcp:
    build:
      context: ./mcp/servers/office-word
      dockerfile: Dockerfile
    image: office-word-mcp:latest
    profiles: ["optional"]
    container_name: office-word-mcp
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9002
    volumes:
      - ${DOCUMENTS_HOST_DIR:-./data/documents}:/documents
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - mcp-servers-network
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Legacy document conversion MCP Server
  docs-converter-mcp:
    build:
      context: ./mcp/servers/docs-converter
      dockerfile: Dockerfile
    image: aiplanner-docs-converter:latest
    profiles: ["optional"]
    container_name: docs-converter-mcp
    restart: unless-stopped
    ports:
      - "9012:9012"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9012
    volumes:
      - ${DOCUMENTS_HOST_DIR:-./data/documents}:/documents
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9012), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PDF2MD MCP Server - HTTP/SSE 模式（可选容器部署）
  # 优先使用本地代理（mcp/proxy）运行，此服务用于独立容器部署
  pdf2md-mcp:
    build:
      context: ./mcp/servers/PDF2MD
      dockerfile: Dockerfile
    image: pdf2md-mcp:latest
    profiles: ["optional"]
    container_name: pdf2md-mcp
    restart: unless-stopped
    ports:
      - "9003:9003"
    env_file:
      - ./mcp/servers/PDF2MD/.env
    environment:
      - PYTHONUNBUFFERED=1
      # VLM配置（生产环境应使用.env文件或配置中心）
      - VLM_MODEL_PROVIDER=${VLM_MODEL_PROVIDER:-qwen}
      - QWEN_API_KEY=sk-a67114a92fdf4964bb6a5f47beccd00d
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL_NAME=${QWEN_MODEL_NAME:-qwen3-vl-flash-2026-01-22}
      - PDF2MD_ALLOW_EXTERNAL_VLM=${PDF2MD_ALLOW_EXTERNAL_VLM:-true}
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    networks:
      - mcp-servers-network
    # 健康检查 - 端口连通性检查
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9003), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PDF2MD Enhanced MCP Server - TaskFlow 模式（可选容器部署）
  # 新版任务化单页处理服务（无 MinerU 依赖，支持动态 VLM 注入）
  pdf2md-enhanced-mcp:
    build:
      context: ./mcp/servers/PDF2MDEnhanced
      dockerfile: Dockerfile
    image: pdf2md-enhanced-mcp:latest
    profiles: ["optional"]
    container_name: pdf2md-enhanced-mcp
    restart: unless-stopped
    ports:
      - "9010:9010"
    environment:
      - PYTHONUNBUFFERED=1
      - PDF2MD_ENH_OUTPUT_DIR=/app/data/output
      - PDF2MD_ENH_PAGE_TIMEOUT_SEC=600
      - PDF2MD_ENH_VLM_CALL_TIMEOUT_CAP_SEC=600
    volumes:
      - ./mcp/servers/PDF2MDEnhanced/data/input:/app/data/input
      - ./mcp/servers/PDF2MDEnhanced/data/output:/app/data/output
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9010), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PageIndex MCP Server - Vectorless page index builder
  pageindex-mcp:
    build:
      context: ./mcp/servers/PageIndex
      dockerfile: Dockerfile
    image: pageindex-mcp:latest
    profiles: ["optional"]
    container_name: pageindex-mcp
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      - PYTHONUNBUFFERED=1
      - PAGEINDEX_VLM_CALL_TIMEOUT_CAP_SEC=1200
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9011), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # K-Graph MCP Server - phase-one BasinComparator graph prebuild
  k-graph-mcp:
    build:
      context: ./mcp/servers/k-graph-mcp
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim
    image: k-graph-mcp:latest
    profiles: ["optional"]
    container_name: k-graph-mcp
    restart: unless-stopped
    ports:
      - "9013:9013"
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9013"
      K_GRAPH_MCP_MONGODB_URI: ${K_GRAPH_MCP_MONGODB_URI}
      MEMBERSHIP_API_URL: ${MEMBERSHIP_SERVICE_URL:-http://host.docker.internal:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      K_GRAPH_MCP_LLM_MODEL: ${K_GRAPH_MCP_LLM_MODEL}
      K_GRAPH_MCP_MAX_WORKERS: ${K_GRAPH_MCP_MAX_WORKERS:-2}
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9013), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # BasinComparator MCP Server - Basin evaluation tools
  basin-comparator-mcp:
    build:
      context: ../basin-comparator/backend
      dockerfile: Dockerfile.mcp
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim
    image: aiplanner-basin-comparator-mcp:latest
    profiles: ["optional"]
    container_name: basin-comparator-mcp
    restart: unless-stopped
    ports:
      - "8139:8139"
    environment:
      PYTHONUNBUFFERED: "1"
      MEMBERSHIP_BASE_URL: ${MEMBERSHIP_BASE_URL:-http://host.docker.internal:8080}
      DOCINTEL_BASE_URL: ${DOCINTEL_BASE_URL:-http://host.docker.internal:8080}
    networks:
      - mcp-servers-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8139), 2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Plan2 Frontend - AIPlanner 前端
  plan2-ui:
    build:
      context: ./plan2
      dockerfile: Dockerfile
    image: plan2-ui:latest
    container_name: plan2-ui-dev
    depends_on:
      mcp-router:
        condition: service_healthy
    ports:
      - "5122:5122"
    environment:
      MEMBERSHIP_UPSTREAM: ${MEMBERSHIP_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp-servers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5122/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# 网络配置
networks:
  mcp-servers-network:
    driver: bridge

# 定义持久化卷
volumes:
  paddleocr-models:
    driver: local
